<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Q-Spot Status</title>
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #fff;
      }

      body {
        color: #777;
        font-family: "Times New Roman", Times, serif;
      }

      main {
        width: min(305px, calc(100% - 32px));
        margin: 0 auto;
        padding-top: clamp(120px, 30vh, 280px);
        text-align: center;
      }

      .welcome {
        margin: 0 0 16px;
        font-size: 18px;
        font-weight: normal;
        line-height: 1.2;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        table-layout: fixed;
        color: #777;
        font-size: 16px;
      }

      td {
        height: 29px;
        padding: 0 6px;
        border: 1px solid #bbb;
        text-align: center;
        vertical-align: middle;
        white-space: nowrap;
      }

      td:first-child {
        width: 44%;
      }

      .logoff {
        display: inline-block;
        margin-top: 22px;
        padding: 2px 8px 3px;
        border: 1px solid #bbb;
        border-radius: 0;
        background: #fff;
        color: #777;
        font: 18px "Times New Roman", Times, serif;
        line-height: 1.15;
        cursor: pointer;
      }

      .logoff:disabled {
        cursor: default;
        opacity: 0.55;
      }

      .note {
        min-height: 1.2em;
        margin: 14px 0 0;
        font-size: 14px;
        line-height: 1.3;
      }

      @media (max-height: 500px) {
        main {
          padding-top: 72px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <p class="welcome">Welcome <span id="welcome-name">guest</span>!</p>

      <table aria-label="Connection status">
        <tbody>
          <tr>
            <td>IP address:</td>
            <td id="client-ip">—</td>
          </tr>
          <tr>
            <td>bytes up/down:</td>
            <td id="client-bytes">— / —</td>
          </tr>
          <tr>
            <td>connected / left:</td>
            <td id="client-time">— / —</td>
          </tr>
          <tr>
            <td>internet access:</td>
            <td id="client-internet">—</td>
          </tr>
          <tr>
            <td>status refresh:</td>
            <td id="client-refresh">5s</td>
          </tr>
        </tbody>
      </table>

      <button class="logoff" id="logoff" type="button">log in</button>
      <p class="note" id="status-note" role="status" aria-live="polite"></p>
    </main>

    <script>
      const REFRESH_SECONDS = 5;
      const nameField = document.getElementById("welcome-name");
      const ipField = document.getElementById("client-ip");
      const timeField = document.getElementById("client-time");
      const internetField = document.getElementById("client-internet");
      const refreshField = document.getElementById("client-refresh");
      const noteField = document.getElementById("status-note");
      const logoffButton = document.getElementById("logoff");

      let session = null;
      let clockTimer = null;
      let refreshing = false;

      refreshField.textContent = `${REFRESH_SECONDS}s`;

      function formatDuration(totalSeconds) {
        const seconds = Math.max(0, Math.floor(totalSeconds));
        const days = Math.floor(seconds / 86400);
        const hours = Math.floor((seconds % 86400) / 3600);
        const minutes = Math.floor((seconds % 3600) / 60);
        const remainder = seconds % 60;
        let result = "";
        if (days) result += `${days}d`;
        if (days || hours) result += `${hours}h`;
        if (days || hours || minutes) result += `${minutes}m`;
        result += `${remainder}s`;
        return result;
      }

      function updateClock() {
        if (!session) return;
        const now = Date.now() / 1000;
        const connected = now - session.started;
        const left = session.expires - now;
        timeField.textContent = `${formatDuration(connected)} / ${formatDuration(left)}`;
        if (left <= 0) {
          clearInterval(clockTimer);
          clockTimer = null;
        }
      }

      function showLoggedOut(message) {
        session = null;
        if (clockTimer) {
          clearInterval(clockTimer);
          clockTimer = null;
        }
        nameField.textContent = "guest";
        ipField.textContent = "—";
        timeField.textContent = "— / —";
        internetField.textContent = "—";
        logoffButton.textContent = "log in";
        logoffButton.disabled = false;
        noteField.textContent = message || "No active session. Please log in.";
      }

      async function refreshStatus() {
        if (refreshing) return;
        refreshing = true;
        try {
          const response = await fetch("/api/status", { cache: "no-store" });
          const data = await response.json();
          if (!response.ok) throw new Error(data.error || "Status unavailable.");
          if (!data.active) {
            showLoggedOut("Your session has ended. Please log in again.");
            return;
          }
          session = data;
          nameField.textContent = data.username || "guest";
          ipField.textContent = data.ip || "—";
          internetField.textContent = data.internet ? "allowed" : "blocked";
          logoffButton.textContent = "log off";
          logoffButton.disabled = false;
          noteField.textContent = data.internet
            ? ""
            : "Connected, but internet access is still being authorized. Retrying automatically…";
          updateClock();
          if (!clockTimer) clockTimer = setInterval(updateClock, 1000);
        } catch (error) {
          noteField.textContent = error.message || "Could not load your session status.";
        } finally {
          refreshing = false;
        }
      }

      logoffButton.addEventListener("click", async () => {
        if (!session) {
          window.location.href = "index.html";
          return;
        }
        logoffButton.disabled = true;
        try {
          await fetch("/api/logout", { method: "POST" });
          showLoggedOut("You have been logged off.");
        } catch (error) {
          logoffButton.disabled = false;
          noteField.textContent = "Could not log off. Please try again.";
        }
      });

      refreshStatus();
      setInterval(refreshStatus, REFRESH_SECONDS * 1000);
    </script>
  </body>
</html>
